org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP still registers generated sources via the old kotlin.sourceSets DSL,
# which AGP 9's built-in Kotlin support disallows by default. Suppress until
# KSP catches up - see https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
