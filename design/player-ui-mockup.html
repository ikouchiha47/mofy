<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mofy Player UI Mockup</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;font-family:-apple-system,Manrope,sans-serif;}
  .player{position:relative;width:100vw;height:100vh;background:#111;overflow:hidden;}
  .video-fill{position:absolute;inset:0;background:linear-gradient(135deg,#1a1a1d,#0e0e10);}

  .back-btn{
    position:absolute;top:24px;left:16px;width:36px;height:36px;
    background:rgba(0,0,0,0.5);border-radius:10px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;
  }

  /* Left/right invisible vertical gesture zones - brightness / volume */
  .gesture-zone{
    position:absolute;top:0;bottom:0;width:30%;
    /* invisible - no background, no border - shown here only for mockup clarity */
    outline:1px dashed rgba(255,255,255,0.08);
  }
  .gesture-zone.left{left:0;}
  .gesture-zone.right{right:0;}
  .gesture-label{
    position:absolute;top:50%;transform:translateY(-50%);
    color:rgba(255,255,255,0.25);font-size:11px;text-align:center;width:100%;
    pointer-events:none;letter-spacing:0.5px;
  }

  /* Center play/pause - YouTube style, single button, not a row */
  .center-controls{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:48px;
  }
  .center-controls .side-btn{
    width:40px;height:40px;color:rgba(255,255,255,0.85);
    display:flex;align-items:center;justify-content:center;font-size:26px;
  }
  .center-controls .play-btn{
    width:72px;height:72px;border-radius:50%;
    background:rgba(0,0,0,0.45);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:34px;
  }

  /* Bottom controls - padded to clear Android nav bar */
  .bottom-controls{
    position:absolute;left:0;right:0;bottom:0;
    padding:12px 16px calc(16px + 34px) 16px; /* 34px ~ nav bar inset */
    background:linear-gradient(transparent,rgba(0,0,0,0.6));
  }
  .seek-row{display:flex;align-items:center;gap:8px;}
  .time{color:#fff;font-size:12px;font-variant-numeric:tabular-nums;min-width:38px;}
  .time.end{text-align:right;}
  .seek-track{
    flex:1;height:3px;background:rgba(255,255,255,0.25);border-radius:2px;position:relative;
  }
  .seek-fill{position:absolute;left:0;top:0;bottom:0;width:38%;background:#E94560;border-radius:2px;}
  .seek-thumb{
    position:absolute;left:38%;top:50%;transform:translate(-50%,-50%);
    width:12px;height:12px;border-radius:50%;background:#E94560;
  }

  .nav-inset-note{
    position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,0.3);font-size:10px;
  }

  .caption{
    position:fixed;top:8px;left:50%;transform:translateX(-50%);
    color:#9A9AA2;font-size:12px;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:6px;
  }
</style>
</head>
<body>
  <div class="player">
    <div class="video-fill"></div>

    <div class="gesture-zone left"><div class="gesture-label">brightness<br>(vertical swipe)</div></div>
    <div class="gesture-zone right"><div class="gesture-label">volume<br>(vertical swipe)</div></div>

    <div class="back-btn">&#8592;</div>

    <div class="center-controls">
      <div class="side-btn">&#8634;</div>
      <div class="play-btn">&#9654;</div>
      <div class="side-btn">&#8635;</div>
    </div>

    <div class="bottom-controls">
      <div class="seek-row">
        <span class="time">04:12</span>
        <div class="seek-track">
          <div class="seek-fill"></div>
          <div class="seek-thumb"></div>
        </div>
        <span class="time end">18:40</span>
      </div>
      <div class="nav-inset-note">padding reserved for Android nav bar</div>
    </div>
  </div>
  <div class="caption">Mockup only - dashed outlines mark invisible gesture zones</div>
</body>
</html>
