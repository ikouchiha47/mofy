[project]
name = "mofy-ml"
version = "0.1.0"
description = "Offline catalog-building pipeline for Mofy: IMDb filtering, TMDB enrichment, EmbeddingGemma embeddings"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.9",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
    "sqlite-vec>=0.1.6",
    "dspy>=3.3.0",
    "websockets>=17.0.1",
    "transformers>=5.14.1",
    "datasets>=5.0.1",
    "torch>=2.13.0",
    "accelerate>=1.1.0",
    "torchao>=0.18.0",
    "modal>=1.5.4",
    "spacy>=3.8.16",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
